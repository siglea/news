# Gitee Pages / Jekyll 配置
# 详细文档：https://gitee.com/help/articles/4136

title: MingoX
description: Multimedia Post in Mixed Languages - 多语言多媒体内容平台
author: siglea

# Gitee Pages 设置
# 可选：使用自定义域名
domain: siglea.gitee.io/news

# 构建设置
# 如需使用 Jekyll 主题，取消下面注释并指定主题
# theme: minima

# 排除文件（构建时忽略）
# 决定哪些路径不会出现在 https://siglea.gitee.io/news 公开站点中。
# EdgeOne 同步使用白名单方案见 edgeone.json + tools/build_dist.sh。
exclude:
  - README.md
  - .gitignore
  - .gitattributes
  - LICENSE
  - Makefile
  - .coze
  - edgeone.json
  - .edgeone
  # 内部目录：流水线源码、草稿、内部文档，不应直链外露
  - content
  - workflow
  - util
  - docs
  - tools
  # 构建产物（本地可能存在）
  - dist
  - .venv
  - venv
  - __pycache__

# 插件（如需要）
# plugins:
#   - jekyll-feed
#   - jekyll-sitemap

# 默认设置
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
